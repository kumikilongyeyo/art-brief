<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Instant D&D-flavoured art briefs: characters, props, creatures, buildings and scenes." />
    <meta name="theme-color" content="#4c35b5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16141f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Art Brief" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Art Brief</title>
    <script>
      // Apply the saved colour scheme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('ab:settings') || 'null');
        var c = s && s.value && s.value.colorScheme;
        if (c === 'light' || c === 'dark') document.documentElement.dataset.theme = c;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
